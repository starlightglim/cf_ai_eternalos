<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EternalOS</title>

    <!-- Default SEO meta tags (updated dynamically by React) -->
    <meta name="description" content="Your corner of the internet. A personal desktop in the browser with classic Mac OS aesthetics." />

    <!-- OpenGraph defaults -->
    <meta property="og:title" content="EternalOS" />
    <meta property="og:description" content="A personal desktop in the browser. No algorithms. No feeds. Just you." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EternalOS" />
    <meta property="og:image" content="/og-default.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EternalOS" />
    <meta name="twitter:description" content="A personal desktop in the browser. No algorithms. No feeds. Just you." />
    <meta name="twitter:image" content="/og-default.svg" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#C0C0C0" />

    <!-- PWA manifest + iOS install support -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EternalOS" />
    <link rel="apple-touch-icon" href="/og-default.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
