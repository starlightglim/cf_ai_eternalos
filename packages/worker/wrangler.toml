# EternalOS Worker Configuration
# See https://developers.cloudflare.com/workers/wrangler/configuration/

name = "eternalos-api"
main = "src/index.ts"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]


# Durable Objects
[[durable_objects.bindings]]
name = "USER_DESKTOP"
class_name = "UserDesktop"

[[durable_objects.bindings]]
name = "OrchestratorAgent"
class_name = "OrchestratorAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDesktop"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DesktopChatAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AppBuilderAgent"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["OrchestratorAgent"]
deleted_classes = ["DesktopChatAgent", "AppBuilderAgent"]

# Dynamic Workers (sandboxed app runtime)
[[worker_loaders]]
binding = "LOADER"

# KV Namespaces
[[kv_namespaces]]
binding = "AUTH_KV"
id = "181861d860e5441a9467effa18a6fa16"

[[kv_namespaces]]
binding = "DESKTOP_KV"
id = "90801c76cfcb483c8dc6f6123ed8f79a"

# R2 Bucket (local dev uses Miniflare simulation)
# For production: wrangler r2 bucket create eternalos-files
[[r2_buckets]]
binding = "ETERNALOS_FILES"
bucket_name = "eternalos-files"

# Workers AI
[ai]
binding = "AI"
remote = true

# Optional local overrides in .dev.vars:
# IMAGE_ANALYSIS_MODEL=@cf/meta/llama-3.2-11b-vision-instruct
# ANTHROPIC_API_KEY=sk-ant-...

# Environment
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://eternalos.app,https://www.eternalos.app,https://eternalos.me,https://www.eternalos.me"

# JWT_SECRET is set via: wrangler secret put JWT_SECRET
# ANTHROPIC_API_KEY is set via: wrangler secret put ANTHROPIC_API_KEY
# For local dev, set secrets in .dev.vars file

# Cloudflare Email Service (outbound) — preferred over Resend when configured.
# 1. Verify sending domain in Cloudflare dashboard: Email Routing → Outbound.
# 2. Uncomment the binding below and deploy.
# 3. Set FROM_EMAIL to an address on the verified domain (e.g. "EternalOS <noreply@eternalos.app>").
# The binding has no API key; CF auto-handles SPF, DKIM, and DMARC alignment.
# [[send_email]]
# name = "SEND_EMAIL"

# RESEND_API_KEY remains a fallback if SEND_EMAIL isn't configured:
# wrangler secret put RESEND_API_KEY

# Google OAuth (optional — enables "Sign in with Google")
# GOOGLE_CLIENT_ID = "your-client-id.apps.googleusercontent.com"  # Set in .dev.vars or here
# GOOGLE_CLIENT_SECRET is set via: wrangler secret put GOOGLE_CLIENT_SECRET

# Scheduled triggers (cron jobs)
# Clean up old trashed items daily at 3:00 AM UTC
[triggers]
crons = ["0 3 * * *"]

# Development settings
[dev]
port = 8787
local_protocol = "http"
